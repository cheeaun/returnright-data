name: Daily snapshot

on:
  push:
    paths:
      - "scripts/fetch_locations.mjs"
  schedule:
    # GitHub cron is UTC. SGT = UTC+8.
    - cron: "15 16 * * *" # 00:15 SGT — attempt 1
    - cron: "15 17 * * *" # 01:15 SGT — retry 1
    - cron: "15 18 * * *" # 02:15 SGT — retry 2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.already_done.outputs.skip }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if today's snapshot is already done
        id: already_done
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run, never skip."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date +%F)
          LAST=$(git log -1 --format=%cs -- data/latest.json || true)
          echo "today=$TODAY last_snapshot=$LAST"
          if [ "$LAST" = "$TODAY" ]; then
            echo "Today's snapshot already committed, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TZ: Asia/Singapore

  fetch:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Singapore

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch latest snapshot
        run: node scripts/fetch_locations.mjs

      - name: Regenerate changelog
        run: node scripts/regenerate_changelog.mjs --today

      - name: Generate latest GeoJSON
        run: node scripts/generate_geojson.mjs

      - name: Generate analysis report
        run: node scripts/analyze_data.mjs --md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md ANALYSIS.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update snapshot for $(date +%F)"
          git push
