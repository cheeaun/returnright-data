name: Daily snapshot

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Singapore

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch latest snapshot
        run: node scripts/fetch_locations.mjs

      - name: Regenerate changelog
        run: node scripts/regenerate_changelog.mjs --today

      - name: Generate latest GeoJSON
        run: node scripts/generate_geojson.mjs

      - name: Generate analysis report
        run: node scripts/analyze_data.mjs --md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md ANALYSIS.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update snapshot for $(date +%F)"
          git push
